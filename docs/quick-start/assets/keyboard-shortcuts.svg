<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-label="Keyboard shortcuts">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08182f"/>
      <stop offset="0.55" stop-color="#0b1426"/>
      <stop offset="1" stop-color="#4a071b"/>
    </linearGradient>
    <linearGradient id="keyFace" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1426"/>
      <stop offset="0.45" stop-color="#245fd5"/>
      <stop offset="1" stop-color="#ff304a"/>
    </linearGradient>
  </defs>
  <rect width="980" height="520" rx="30" fill="url(#bg)"/>
  <text x="38" y="62" font-family="Arial Black, Impact, sans-serif" font-size="36" fill="#f8fbff">Keyboard radio controls</text>
  <text x="40" y="92" font-family="Arial, sans-serif" font-size="19" fill="#bcd2ff">Tune keys must be on. Scanning disables tune keys until stopped.</text>

      <g transform="translate(30,112)">
        <rect width="190" height="126" rx="18" fill="#dce9ff"/>
        <rect x="10" y="10" width="170" height="92" rx="14" fill="url(#keyFace)" stroke="#f8fbff" stroke-width="2"/>
        <text x="95" y="76" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="62" fill="#fff">`</text>
        <text x="95" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fbff">PTT hold</text>
      </g>
      <g transform="translate(260,112)">
        <rect width="190" height="126" rx="18" fill="#dce9ff"/>
        <rect x="10" y="10" width="170" height="92" rx="14" fill="url(#keyFace)" stroke="#f8fbff" stroke-width="2"/>
        <text x="95" y="76" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="62" fill="#fff">H</text>
        <text x="95" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fbff">Start hunt</text>
      </g>
      <g transform="translate(490,112)">
        <rect width="190" height="126" rx="18" fill="#dce9ff"/>
        <rect x="10" y="10" width="170" height="92" rx="14" fill="url(#keyFace)" stroke="#f8fbff" stroke-width="2"/>
        <text x="95" y="66" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="34" fill="#fff">LEFT</text>
        <text x="95" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fbff">-5 Hz</text>
      </g>
      <g transform="translate(720,112)">
        <rect width="190" height="126" rx="18" fill="#dce9ff"/>
        <rect x="10" y="10" width="170" height="92" rx="14" fill="url(#keyFace)" stroke="#f8fbff" stroke-width="2"/>
        <text x="95" y="66" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="34" fill="#fff">RIGHT</text>
        <text x="95" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fbff">+5 Hz</text>
      </g>
      <g transform="translate(30,292)">
        <rect width="190" height="126" rx="18" fill="#dce9ff"/>
        <rect x="10" y="10" width="170" height="92" rx="14" fill="url(#keyFace)" stroke="#f8fbff" stroke-width="2"/>
        <text x="95" y="76" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="62" fill="#fff">UP</text>
        <text x="95" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fbff">+10 Hz</text>
      </g>
      <g transform="translate(260,292)">
        <rect width="190" height="126" rx="18" fill="#dce9ff"/>
        <rect x="10" y="10" width="170" height="92" rx="14" fill="url(#keyFace)" stroke="#f8fbff" stroke-width="2"/>
        <text x="95" y="66" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="34" fill="#fff">DOWN</text>
        <text x="95" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fbff">-10 Hz</text>
      </g>
      <g transform="translate(490,292)">
        <rect width="190" height="126" rx="18" fill="#dce9ff"/>
        <rect x="10" y="10" width="170" height="92" rx="14" fill="url(#keyFace)" stroke="#f8fbff" stroke-width="2"/>
        <text x="95" y="76" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="62" fill="#fff">,</text>
        <text x="95" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fbff">-1 Hz</text>
      </g>
      <g transform="translate(720,292)">
        <rect width="190" height="126" rx="18" fill="#dce9ff"/>
        <rect x="10" y="10" width="170" height="92" rx="14" fill="url(#keyFace)" stroke="#f8fbff" stroke-width="2"/>
        <text x="95" y="76" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="62" fill="#fff">.</text>
        <text x="95" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fbff">+1 Hz</text>
      </g>
</svg>
